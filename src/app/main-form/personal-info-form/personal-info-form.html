<main class="personal-info-form-container">
  <h2 class="heading blue-950">Personal info</h2>
  <p class="sub-heading grey-500">
    Please provide your name, email address, and phone number.
  </p>
  <section class="personal-info-form">
    <form #f="ngForm" (ngSubmit)="submit(f)">
      <div class="form-label-container">
        <label class="form-label blue-950">Name</label>
        @if (!validName) {
        <span class="require-field">This field is required</span>
        }
      </div>
      <input
        class="form-input"
        type="text"
        name="name"
        [(ngModel)]="personalInfo.name"
        required
        #nameCtrl="ngModel"
      />
      <div class="form-label-container">
        <label class="form-label blue-950">Email Address</label>
        @if (!validEmail) {
        <span class="require-field">This field is required</span>
        }
      </div>
      <input
        class="form-input"
        type="text"
        name="email"
        [(ngModel)]="personalInfo.email"
        required
        #emailCtrl="ngModel"
      />
      <div class="form-label-container">
        <label class="form-label blue-950">Phone Number</label>
        @if (!validNumber) {
        <span class="require-field">This field is required</span>
        }
      </div>
      <input
        class="form-input"
        type="text"
        name="phnNumber"
        [(ngModel)]="personalInfo.phnNumber"
        required
        maxlength="13"
        #phnCtrl="ngModel"
      />
      <button>Next Step</button>
    </form>
  </section>
</main>
